<!DOCTYPE html>
<!--
【ChatGPT】
【FileName】index.html
【作成日時】2026-10-21
【概要】子ども向け計算練習アプリ。1桁の足し算・引き算を電卓式ボタンで練習する。
【使い方】ブラウザで開き、計算を選んで「練習スタート」。数字を押すとすぐに答え合わせ。
【仕様】ランダム練習と全パターン練習を選択。全パターンは0を含む順序別55問を重複なく出題し、誤答を後で復習して全問正解で終了。途中終了可。進捗保存なし。読み上げ、音声入力、3つの数、マイナスの答えは未実装。
-->
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8ff">
    <title>けいさんチャレンジ v0.3</title>
  <style>
    :root { color-scheme: light; --ink:#26334b; --muted:#71809a; --blue:#5c76ed; --purple:#8d68dc; --mint:#54c8a2; --pink:#ff8b9d; --paper:#fff; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:linear-gradient(160deg,#f0f4ff 0%,#fff7f2 60%,#f5fff9 100%); color:var(--ink); font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif; display:flex; justify-content:center; padding:20px 14px 28px; }
    button { font:inherit; color:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent; }
    .app { width:min(100%,480px); }
    header { display:flex; align-items:center; justify-content:space-between; margin:2px 2px 15px; }
    .brand { display:flex; align-items:center; gap:10px; }
    .logo { width:44px;height:44px;border-radius:15px;background:#fff;display:grid;place-items:center;font-size:25px;box-shadow:0 5px 16px #6377bb22; }
    h1 { font-size:20px; line-height:1.2; margin:0; letter-spacing:.02em; }
    .version { font-size:11px;color:var(--muted);font-weight:700;margin-top:3px; }
    .badge { color:#5870d7;background:#e8edff;border-radius:99px;padding:7px 11px;font-size:12px;font-weight:800; }
    .card { background:var(--paper); border:1px solid #e9edfa; border-radius:26px; box-shadow:0 12px 34px #53618a12; padding:22px; }
    .setup { margin-bottom:14px; }
    .setup h2 { font-size:17px;margin:0 0 5px; }
    .hint { color:var(--muted);font-size:13px;line-height:1.55;margin:0; }
    .choice-row { display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:17px; }
    .choice { min-height:55px;border:2px solid #e8ecf7;background:#fff;border-radius:16px;font-weight:800;transition:.15s; }
    .choice[aria-pressed="true"] { border-color:var(--blue);background:#f0f3ff;color:#435fd8;box-shadow:0 3px 10px #5c76ed1c; }
    .choice small { display:block;font-size:11px;font-weight:500;line-height:1.5;margin-top:5px; }
    .mode-choice { padding:12px 6px; }
    .mode-hint { margin-top:12px; }
    .session-info { margin:0 2px 10px; }
    .choice .symbol { font-size:21px;vertical-align:-2px;margin-right:5px; }
    .start { width:100%;margin-top:16px;border:0;border-radius:17px;background:linear-gradient(100deg,var(--blue),var(--purple));color:white;padding:15px;font-weight:900;font-size:16px;box-shadow:0 7px 16px #7368d533; }
    .start:active,.key:active,.choice:active { transform:translateY(1px) scale(.99); }
    .stage { display:flex;align-items:center;justify-content:space-between;margin:0 2px 11px; }
    .stage-name { font-size:13px;font-weight:800;color:#5265b9; }
    .progress { color:var(--muted);font-size:12px;font-weight:700; }
    .problem-card { text-align:center;padding:19px 20px 16px; }
    .problem { font-size:clamp(48px,13vw,68px);font-weight:900;letter-spacing:.02em;line-height:1.2;margin:8px 0 15px;font-variant-numeric:tabular-nums; }
    .answer-box { margin:0 auto;max-width:245px;min-height:53px;border-radius:15px;background:#f5f7fc;border:2px solid #e8edf8;display:flex;align-items:center;justify-content:center;font-size:27px;font-weight:800;color:#3e4e6a; }
    .answer-box.empty { color:#b5bfd1; }
    .feedback { min-height:24px;margin:9px 0 0;font-size:14px;font-weight:800; }
    .feedback.good { color:#23966d; }
    .feedback.try { color:#e47759; }
    .keypad { display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:13px; }
    .key { min-height:57px;border:1px solid #b9c8db;border-radius:13px;background:#eaf1ff;color:#173c73;font-size:23px;font-weight:800;touch-action:manipulation;transition:transform .08s,filter .08s,opacity .12s; }
    .key:active:not(:disabled) { filter:brightness(.94);transform:translateY(1px); }
    .key.utility { background:#f2f5fa;color:#29405d;font-size:16px; }
    .key.chosen-answer,.key.chosen-answer:disabled { opacity:1!important;background:color-mix(in srgb,#eaf1ff 55%,#85aff0 45%);filter:none;box-shadow:none;transform:none; }
    .key:disabled:not(.chosen-answer) { opacity:.55;cursor:default; }
    .actions { display:flex;gap:9px;margin-top:14px; }
    .secondary { flex:1;border:1px solid #e5e9f3;background:#fff;border-radius:14px;padding:12px 8px;font-weight:800;font-size:14px; }
    .secondary.stop { color:#71809a; }
    .tiny { font-size:11px;color:#8994a8;text-align:center;margin:13px 4px 0;line-height:1.5; }
    .done { text-align:center;padding:34px 22px; }
    .done .emoji {font-size:58px;margin-bottom:12px;}
    .done h2 {margin:0 0 8px;font-size:24px;}
    .done p {margin:0;color:var(--muted);font-size:14px;line-height:1.6;}
    .hidden { display:none !important; }
    @media (max-width:380px) { body{padding:12px 10px 20px}.card{padding:18px}.key{min-height:53px} }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="brand"><div class="logo" aria-hidden="true">🧮</div><div><h1>けいさんチャレンジ</h1><div class="version">VERSION 0.3 · おためし版</div></div></div>
      <div class="badge">1けた</div>
    </header>

    <section id="setup" class="card setup">
      <h2>きょうの れんしゅう</h2>
      <p class="hint">やりたい計算をえらんでね。いつでも「おわる」を押せるよ。</p>
      <div class="choice-row" role="group" aria-label="計算の種類">
        <button class="choice" data-op="add" aria-pressed="true"><span class="symbol">＋</span>たしざん</button>
        <button class="choice" data-op="sub" aria-pressed="false"><span class="symbol">−</span>ひきざん</button>
      </div>
      <div class="choice-row" role="group" aria-label="練習のしかた">
        <button class="choice mode-choice" data-mode="all" aria-pressed="false">全パターンれんしゅう<small>ぜんぶ せいかいを めざそう</small></button>
        <button class="choice mode-choice" data-mode="random" aria-pressed="true">ランダムれんしゅう<small>すきなだけ やって おわろう</small></button>
      </div>
      <p id="modeHint" class="hint mode-hint">すきなところで おわれるよ。まちがえたら、その場でもういちど。</p>
      <button id="start" class="start">れんしゅうスタート</button>
      <p class="tiny">いまは、くり上がり・くり下がりのない計算だよ。<br>全パターンは0をふくむ55問。2＋3と3＋2は別の問題だよ。<br>とちゅうで おわると、つぎは はじめからになるよ。</p>
    </section>

    <section id="practice" class="hidden">
      <div class="stage"><div class="stage-name">🌱 くり上がり・くり下がりなし</div><div class="progress"><span id="progressText">0もん せいかい</span></div></div>
      <p id="sessionInfo" class="hint session-info"></p>
      <div class="card problem-card">
        <div id="problem" class="problem" aria-live="polite">3 ＋ 4 ＝ ?</div>
        <div id="answer" class="answer-box empty" aria-label="入力した答え">?</div>
        <div id="feedback" class="feedback" aria-live="polite">こたえを いれてね</div>
      </div>
      <div class="keypad" aria-label="電卓式入力">
        <button class="key" data-digit="1">1</button><button class="key" data-digit="2">2</button><button class="key" data-digit="3">3</button>
        <button class="key" data-digit="4">4</button><button class="key" data-digit="5">5</button><button class="key" data-digit="6">6</button>
        <button class="key" data-digit="7">7</button><button class="key" data-digit="8">8</button><button class="key" data-digit="9">9</button>
        <button class="key utility" data-action="clear">けす</button><button class="key" data-digit="0">0</button><button class="key utility" data-action="back">⌫</button>
      </div>
      <div class="actions"><button id="stop" class="secondary stop">おわる</button></div>
      <p id="practiceHint" class="tiny"></p>
    </section>

    <section id="finish" class="card done hidden">
      <div class="emoji">🌟</div><h2 id="finishTitle">よくがんばったね！</h2>
      <p id="finishSummary"></p>
      <button id="again" class="start">もういちど</button>
    </section>
  </main>
  <script>
    const setup = document.querySelector('#setup');
    const practice = document.querySelector('#practice');
    const finish = document.querySelector('#finish');
    const problemEl = document.querySelector('#problem');
    const answerEl = document.querySelector('#answer');
    const feedbackEl = document.querySelector('#feedback');
    let operation = 'add';
    let mode = 'random';
    let current = null;
    let input = '';
    let solved = 0;
    let locked = true;
    let advanceTimer = null;
    let pool = [];
    let queue = [];
    let reviewQueue = [];
    let reviewing = false;

    document.querySelectorAll('[data-op]').forEach(button => button.addEventListener('click', () => {
      operation = button.dataset.op;
      document.querySelectorAll('[data-op]').forEach(item => item.setAttribute('aria-pressed', String(item === button)));
    }));
    document.querySelectorAll('[data-mode]').forEach(button => button.addEventListener('click', () => {
      mode = button.dataset.mode;
      document.querySelectorAll('[data-mode]').forEach(item => item.setAttribute('aria-pressed', String(item === button)));
      document.querySelector('#modeHint').textContent = mode === 'all'
        ? '55問をひととおり → まちがえた問題をふくしゅう → 全問せいかいでゴール！'
        : 'すきなところで おわれるよ。まちがえたら、その場でもういちど。';
    }));

    function buildPool(op) {
      const questions = [];
      for (let a = 0; a <= 9; a++) {
        for (let b = 0; b <= 9; b++) {
          if (op === 'add' && a + b <= 9) questions.push({ a, b, answer: a + b, sign: '+' });
          if (op === 'sub' && a >= b) questions.push({ a, b, answer: a - b, sign: '−' });
        }
      }
      return questions;
    }

    function shuffled(items) {
      const result = [...items];
      for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
      }
      return result;
    }

    function updateProgress() {
      document.querySelector('#progressText').textContent = mode === 'all'
        ? `${solved} / ${pool.length}もん せいかい` : `${solved}もん せいかい`;
      document.querySelector('#sessionInfo').textContent = mode === 'all'
        ? (reviewing ? `ふくしゅうタイム · あと ${pool.length - solved}もん` : `全パターンれんしゅう · ${pool.length - queue.length} / ${pool.length}もんめ`)
        : 'ランダムれんしゅう · すきなところで おわれるよ';
    }

    function resetInput(message = 'こたえを いれてね') {
      input = '';
      locked = false;
      document.querySelectorAll('.key').forEach(button => { button.disabled = false; button.classList.remove('chosen-answer'); });
      feedbackEl.textContent = message;
      feedbackEl.className = 'feedback';
      updateAnswer();
    }

    function makeQuestion() {
      clearTimeout(advanceTimer);
      if (mode === 'all') {
        if (!queue.length) {
          if (!reviewQueue.length) { endSession(true); return; }
          queue = shuffled(reviewQueue);
          reviewQueue = [];
          reviewing = true;
        }
        current = queue.shift();
      } else {
        current = pool[Math.floor(Math.random() * pool.length)];
      }
      resetInput();
      problemEl.textContent = `${current.a} ${current.sign} ${current.b} ＝ ?`;
      updateProgress();
    }

    function endSession(completed = false) {
      clearTimeout(advanceTimer);
      locked = true;
      practice.classList.add('hidden');
      finish.classList.remove('hidden');
      document.querySelector('#finishTitle').textContent = completed ? 'ぜんもん せいかい！' : 'よくがんばったね！';
      document.querySelector('#finishSummary').textContent = completed
        ? `${pool.length}問ぜんぶ せいかいできたね！ まちがえた問題も ふくしゅうできたよ。`
        : mode === 'all' ? `${pool.length}問のうち ${solved}問 せいかい！ また チャレンジしよう。`
        : `こんかいは ${solved}問 せいかい！ また いつでも れんしゅうしよう。`;
    }

    function updateAnswer() {
      answerEl.textContent = input || '?';
      answerEl.classList.toggle('empty', !input);
    }

    function typeDigit(digit) {
      if (locked || !current || practice.classList.contains('hidden') || input.length >= String(current.answer).length) return;
      input += digit;
      updateAnswer();
      if (input.length >= String(current.answer).length) checkAnswer();
    }

    function checkAnswer() {
      if (locked || input === '') {
        if (input === '') {
          feedbackEl.textContent = 'こたえを いれてね';
          feedbackEl.className = 'feedback try';
        }
        return;
      }
      locked = true;
      document.querySelectorAll('.key').forEach(button => {
        button.disabled = true;
        if (button.dataset.digit && input.includes(button.dataset.digit)) button.classList.add('chosen-answer');
      });
      if (Number(input) === current.answer) {
        solved += 1;
        updateProgress();
        feedbackEl.textContent = '○ せいかい！';
        feedbackEl.className = 'feedback good';
        advanceTimer = setTimeout(() => { if (!practice.classList.contains('hidden') && locked) makeQuestion(); }, 650);
      } else {
        feedbackEl.textContent = `× せいかいは ${current.answer}`;
        feedbackEl.className = 'feedback try';
        if (mode === 'all') {
          reviewQueue.push(current);
          advanceTimer = setTimeout(() => { if (!practice.classList.contains('hidden') && locked) makeQuestion(); }, 1000);
        } else {
          advanceTimer = setTimeout(() => {
            if (!practice.classList.contains('hidden') && locked) resetInput('もういちど こたえてね');
          }, 750);
        }
      }
    }

    document.querySelectorAll('[data-digit]').forEach(button => button.addEventListener('click', () => typeDigit(button.dataset.digit)));
    document.querySelector('[data-action="clear"]').addEventListener('click', () => { if (!locked) { input = ''; updateAnswer(); } });
    document.querySelector('[data-action="back"]').addEventListener('click', () => { if (!locked) { input = input.slice(0, -1); updateAnswer(); } });
    document.querySelector('#start').addEventListener('click', () => {
      solved = 0;
      clearTimeout(advanceTimer);
      pool = buildPool(operation);
      queue = mode === 'all' ? shuffled(pool) : [];
      reviewQueue = [];
      reviewing = false;
      document.querySelector('#practiceHint').textContent = mode === 'all'
        ? '数字を押すとすぐに判定。まちがえた問題は、あとでふくしゅうするよ。'
        : '数字を押すとすぐに判定。まちがえたら、同じ問題をもう一度！';
      setup.classList.add('hidden'); finish.classList.add('hidden'); practice.classList.remove('hidden'); makeQuestion();
    });
    document.querySelector('#stop').addEventListener('click', () => endSession());
    document.querySelector('#again').addEventListener('click', () => {
      finish.classList.add('hidden'); setup.classList.remove('hidden');
    });
    document.addEventListener('keydown', event => {
      if (practice.classList.contains('hidden')) return;
      if (/^\d$/.test(event.key)) typeDigit(event.key);
      else if (event.key === 'Backspace' && !locked) { input = input.slice(0, -1); updateAnswer(); }
      else if (event.key === 'Enter') checkAnswer();
      else if (event.key === 'Escape' && !locked) { input = ''; updateAnswer(); }
    });
  </script>
</body>
</html>
